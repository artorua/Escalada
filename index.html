// --- PLAYLIST MANAGEMENT ---
let playlist = ['bgm_game_1', 'bgm_game_2', 'bgm_game_3'];
let current_track_idx = 0;
let loop_current_track = false;

// Conecta os listeners de áudio para passar de faixa automaticamente
playlist.forEach(track => {
    if (AUDIO[track]) {
        AUDIO[track].addEventListener('ended', function() {
            if (loop_current_track) {
                this.currentTime = 0;
                this.play();
            } else {
                current_track_idx = (current_track_idx + 1) % playlist.length;
                playBGM('bgm_game', true);
            }
        });
    }
});

let audio_initialized = false;
let currentBGM = null;

function initAudioContext() {
    if (audio_initialized) return;
    audio_initialized = true;
    if (game_state === 'TITLE') playBGM('bgm_menu');
}

function playSFX(key) {
    if (!audio_initialized) return;
    if (AUDIO[key]) {
        let snd = AUDIO[key].cloneNode(); 
        snd.volume = 0.5; snd.play().catch(e => {}); 
    }
}

function playBGM(key, force=false) {
    if (!audio_initialized) return;
    let targetAudio = AUDIO[key];
    
    if (key === 'bgm_game') {
        targetAudio = AUDIO[playlist[current_track_idx]];
    }
    
    if (!force && currentBGM === targetAudio) return;
    
    if (currentBGM) { currentBGM.pause(); currentBGM.currentTime = 0; }
    currentBGM = targetAudio;
    if (currentBGM) { 
        if (key === 'bgm_game') {
            currentBGM.loop = loop_current_track;
        } else {
            currentBGM.loop = true; 
        }
        currentBGM.volume = 0.3; 
        currentBGM.play().catch(e => {}); 
    }
}

let gamepad_deadzone = 0.2;
function updateGamepadInput() {
    const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
    if (!gamepads) return; let gp = gamepads[0]; if (!gp) return;
    if (!audio_initialized && gp.buttons.some(b => b.pressed)) initAudioContext();

    let dpadLeft = gp.buttons[14]?.pressed; let dpadRight = gp.buttons[15]?.pressed;
    gp_in.left = dpadLeft || (axisX < -gamepad_deadzone); gp_in.right = dpadRight || (axisX > gamepad_deadzone);
    gp_in.up = dpadUp || (axisY < -gamepad_deadzone); gp_in.down = dpadDown || (axisY > gamepad_deadzone);
    gp_in.jump = gp.buttons[0]?.pressed; 
    gp_in.dash = gp.buttons[2]?.pressed || gp.buttons[1]?.pressed || gp.buttons[5]?.pressed || gp.buttons[7]?.pressed;

function clamp(val, a, b) { return Math.max(a, Math.min(b, val)); }
function appr(val, target, amount) { return val > target ? Math.max(val - amount, target) : Math.min(val + amount, target); }
function sign(v) { return v > 0 ? 1 : (v < 0 ? -1 : 0); }
function rectIntersect(x1, y1, w1, h1, x2, y2, w2, h2) { return x2 < x1 + w1 && x2 + w2 > x1 && y2 < y1 + h1 && y2 + h2 > y1; }

function checkPassword(inputArray) {
    for (let i = 0; i < PASSWORDS_PER_LEVEL.length; i++) {
        const pw = PASSWORDS_PER_LEVEL[i];
        if (pw && pw[0] === inputArray[0] && pw[1] === inputArray[1] && pw[2] === inputArray[2] && pw[3] === inputArray[3]) return i;
    }
    return -1;
}

function drawTile(ctx, id, x, y, flipX = false) {
    if (TILES.FLAG.includes(id)) {
        let flagFrame = Math.floor(frames / 8) % 3;
        id = TILES.FLAG[flagFrame];
    }

    if (!sprites.tileset.complete || sprites.tileset.naturalHeight === 0) {
        if (TILES.SOLID.includes(id)) ctx.fillStyle = '#1e3a8a';
        else if (TILES.ONEWAY.includes(id)) ctx.fillStyle = '#9ca3af'; // One-way platforms fallback color
        else if (TILES.ICE.includes(id)) ctx.fillStyle = '#67e8f9';
        else if (id === TILES.BALLOON || TILES.BALLOON_TAIL.includes(id)) ctx.fillStyle = '#ec4899';
        else if (TILES.SPRING.includes(id)) ctx.fillStyle = '#10b981';
        else if ([TILES.SPIKE_UP, TILES.SPIKE_DOWN, TILES.SPIKE_RIGHT, TILES.SPIKE_LEFT].includes(id)) ctx.fillStyle = '#ef4444';
        else if (TILES.CRUMBLE.includes(id)) ctx.fillStyle = '#d97706';
        else if (id === TILES.TREASURE || id === TILES.ORB || TILES.KEY.includes(id)) ctx.fillStyle = '#f59e0b';
        else if (TILES.CLOUD_LEFT.includes(id) || TILES.CLOUD_RIGHT.includes(id)) ctx.fillStyle = '#f3f4f6';
        else if (id === TILES.CHEST || TILES.FAKE_WALL.TL === id || TILES.FAKE_WALL.TR === id || TILES.FAKE_WALL.BL === id || TILES.FAKE_WALL.BR === id) ctx.fillStyle = '#92400e';
        else if (TILES.DECOR.includes(id)) ctx.fillStyle = '#166534'; 
        else ctx.fillStyle = '#4b5563'; 
        ctx.fillRect(Math.round(x), Math.round(y), 8, 8); return;
    }
    let sx = (id % 3) * 8; let sy = Math.floor(id / 3) * 8; ctx.save(); let drawX = Math.round(x); let drawY = Math.round(y);
    if (flipX) { ctx.translate(drawX + 8, drawY); ctx.scale(-1, 1); drawX = 0; drawY = 0; }
    ctx.drawImage(sprites.tileset, sx, sy, 8, 8, drawX, drawY, 8, 8); ctx.restore();
}

function drawControlsMenu(ctx, sel_idx) {
    ctx.fillStyle = '#f472b6'; ctx.font = '8px "Press Start 2P", monospace'; ctx.fillText("ESC CANCELA BOTAO", 80, 20); ctx.font = '8px "Press Start 2P", monospace';
    for(let i=0; i < configActions.length; i++) {
        let actionStr = configLabels[i]; let keyStr = keyConfig[configActions[i]];
        if (keyStr.startsWith('Key')) keyStr = keyStr.slice(3); else if (keyStr.startsWith('Arrow')) keyStr = keyStr.slice(5); else if (keyStr === 'Space') keyStr = 'Espaco';
        if (waiting_for_key_index === i) { ctx.fillStyle = '#f59e0b'; keyStr = "..."; } else { ctx.fillStyle = sel_idx === i ? '#fff' : '#6b7280'; }
        ctx.fillText((sel_idx === i ? ">" : "") + actionStr + ":" + keyStr, 80, 40 + i*13);
    }
    ctx.fillStyle = sel_idx === 6 ? '#fff' : '#6b7280'; ctx.fillText((sel_idx === 6 ? "> " : "") + "VOLTAR", 80, 40 + 6*13 + 10);
}

// --- CLASSES ---
class Balloon {
    constructor(x, y) { this.x = x; this.y = y; this.timer = 0; this.active = true; }
    update() {
        if (!this.active) { this.timer--; if (this.timer <= 0) this.active = true; return; }
        if (rectIntersect(this.x, this.y, 8, 8, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h)) {
            p.djump = max_djump; this.active = false; this.timer = 60; freeze = 2; playSFX('balloon');
        }
    }
    draw(ctx) {
        if (!this.active) return; let hoverY = Math.sin(frames * 0.1) * 2; let tailFrame = Math.floor(frames / 8) % 3;
        drawTile(ctx, TILES.BALLOON, this.x, this.y + hoverY); drawTile(ctx, TILES.BALLOON_TAIL[tailFrame], this.x, this.y + 8 + hoverY);
    }
}
class Spring {
    constructor(x, y) { this.x = x; this.y = y; this.pressed = 0; this.is_solid = true; this.w = 8; this.h = 8; }
    update() {
        if (this.pressed > 0) this.pressed--;
        let hit_top = rectIntersect(this.x + 1, this.y - 2, 6, 4, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h);
        if (hit_top && p.spd.y >= 0) { p.spd.y = -4; p.djump = max_djump; this.pressed = 15; playSFX('spring'); }
    }
    draw(ctx) { drawTile(ctx, this.pressed > 0 ? TILES.SPRING[1] : TILES.SPRING[0], this.x, this.y); }
}
class Spike {
    constructor(x, y, dir) { this.x = x; this.y = y; this.dir = dir; } 
    update() {
        let hx = this.x, hy = this.y, hw = 8, hh = 8;
        if (this.dir === 0) { hx += 1; hy += 4; hw -= 2; hh -= 4; } else if (this.dir === 1) { hx += 1; hw -= 2; hh -= 4; } else if (this.dir === 2) { hx += 4; hy += 1; hw -= 4; hh -= 2; } else if (this.dir === 3) { hy += 1; hw -= 4; hh -= 2; } 
        if (rectIntersect(hx, hy, hw, hh, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h)) kill_player('spike');
    }
    draw(ctx) { drawTile(ctx, [TILES.SPIKE_UP, TILES.SPIKE_DOWN, TILES.SPIKE_RIGHT, TILES.SPIKE_LEFT][this.dir], this.x, this.y); }
}
class CrumbleBlock {
    constructor(x, y) { this.x = x; this.y = y; this.state = 0; this.timer = 0; this.is_solid = true; this.w = 8; this.h = 8; }
    update() {
        if (this.state === 0) {
            let hit = rectIntersect(this.x - 1, this.y - 1, 10, 10, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h);
            if (hit) { this.state = 1; this.timer = 15; playSFX('crumble'); }
        } else if (this.state === 1) {
            this.timer--; if (this.timer <= 0) { this.state = 2; this.timer = 60; this.is_solid = false; }
        } else if (this.state === 2) {
            this.timer--; let hit = rectIntersect(this.x, this.y, 8, 8, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h);
            if (this.timer <= 0 && !hit) { this.state = 0; this.is_solid = true; }
        }
    }
    draw(ctx) {
        if (this.state === 2) return; let tileId = TILES.CRUMBLE[0]; let shakeX = 0;
        if (this.state === 1) { tileId = TILES.CRUMBLE[frames % 2 === 0 ? 1 : 2]; shakeX = (frames % 2 === 0 ? 1 : -1); }
        drawTile(ctx, tileId, this.x + shakeX, this.y);
    }
}
class FakeWall {
    constructor(x, y) { this.x = x; this.y = y; this.broken = false; this.is_solid = true; this.w = 16; this.h = 16; this.shake_timer = 0; }
    update() {
        if (this.broken) { if (this.shake_timer > 0) this.shake_timer--; return; }
        let hit = rectIntersect(this.x - 2, this.y - 2, 20, 20, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h);
        if (hit && p.dash_time > 0) {
            this.broken = true; this.is_solid = false; this.shake_timer = 10;
            p.spd.x = -sign(p.spd.x) * 1.5; p.spd.y = -1.5; p.dash_time = -1;
            p.djump = max_djump; freeze = 4; screen_shake = 6; playSFX('break');
        }
    }
    draw(ctx) {
        if (this.broken && this.shake_timer <= 0) return; 
        let shakeX = 0; if (this.shake_timer > 0) shakeX = (frames % 2 === 0 ? 1 : -1);
        drawTile(ctx, TILES.FAKE_WALL.TL, this.x + shakeX, this.y); drawTile(ctx, TILES.FAKE_WALL.TR, this.x + 8 + shakeX, this.y);
        drawTile(ctx, TILES.FAKE_WALL.BL, this.x + shakeX, this.y + 8); drawTile(ctx, TILES.FAKE_WALL.BR, this.x + 8 + shakeX, this.y + 8);
    }
}
class Cloud {
    constructor(x, y, dir) { this.x = x; this.y = y; this.w = 16; this.h = 8; this.is_oneway = true; this.dir = dir; this.speed = 0.5; }
    update() { 
        this.x += this.dir * this.speed; if (this.x < -16) this.x = 160; if (this.x > 160) this.x = -16;
        let hit_player = rectIntersect(p.x + p.hitbox.x, p.y + p.hitbox.y + 1, p.hitbox.w, p.hitbox.h, this.x, this.y, this.w, this.h);
        let not_inside = !rectIntersect(p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h, this.x, this.y, this.w, this.h);
        if (hit_player && not_inside && p.spd.y >= 0 && !p.is_spawning) p.move_x(this.dir * this.speed);
    } 
    draw(ctx) {
        let t1 = this.dir === -1 ? TILES.CLOUD_LEFT[0] : TILES.CLOUD_RIGHT[0]; let t2 = this.dir === -1 ? TILES.CLOUD_LEFT[1] : TILES.CLOUD_RIGHT[1];
        drawTile(ctx, t1, this.x, this.y); drawTile(ctx, t2, this.x + 8, this.y);
    }
}
class Key {
    constructor(x, y, id) { this.x = x; this.y = y; this.collected = false; this.id = id; }
    update() {
        if (this.collected) return;
        if (rectIntersect(this.x, this.y, 8, 8, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h)) {
            this.collected = true; freeze = 2; playSFX('key');
            p.session_keys.push(this.id);
            hud_keys++; updateHUD();
        }
    }
    draw(ctx) { if (this.collected) return; let frame = Math.floor(frames / 5) % 3; let hoverY = Math.sin(frames * 0.1) * 2; drawTile(ctx, TILES.KEY[frame], this.x, this.y + hoverY); }
}
class Chest {
    constructor(x, y, id) { this.x = x; this.y = y; this.opened = false; this.id = id; }
    update() {
        if (this.opened) return;
        if (p.session_keys.length > 0 && rectIntersect(this.x - 2, this.y - 2, 12, 12, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h)) {
            this.opened = true; freeze = 5; 
            objects.push(new Treasure(this.x, this.y - 12, false, this.id + "_t")); 
            playSFX('chest');
            
            // Consome a chave da HUD e a transforma em "Gasta Permanente"
            let spent_key = p.session_keys.shift();
            level_state[current_level].keys.push(spent_key);
            level_state[current_level].chests.push(this.id);
            
            hud_keys--; updateHUD();
        }
    }
    draw(ctx) { if (this.opened) return; drawTile(ctx, TILES.CHEST, this.x, this.y); }
}
class Treasure {
    constructor(x, y, isOrb = false, id) { this.x = x; this.y = y; this.collected = false; this.isOrb = isOrb; this.flying = false; this.id = id; }
    update() {
        if (this.collected) return;
        if (this.isOrb && room_dashed) this.flying = true; 
        if (this.flying) { 
            this.y -= 1; 
            if (this.y < -16) this.collected = true; 
        }
        
        if (rectIntersect(this.x, this.y, 8, 8, p.x + p.hitbox.x, p.y + p.hitbox.y, p.hitbox.w, p.hitbox.h)) {
            this.collected = true; p.djump = max_djump; freeze = 3; playSFX(this.isOrb ? 'orb' : 'treasure');
            level_state[current_level].treasures.push(this.id); 
            
            // Atualiza HUD de forma global
            hud_treasures = 0;
            for (let lvl in level_state) {
                hud_treasures += level_state[lvl].treasures.length;
            }
            updateHUD();
        }
    }
    draw(ctx) {
        if (this.collected) return;
        let hoverY = this.flying ? 0 : Math.sin(frames * 0.05) * 2; drawTile(ctx, this.isOrb ? TILES.ORB : TILES.TREASURE, this.x, this.y + hoverY);
    }
}


function load_level(idx, is_death) {
    if (idx >= LEVELS_DATA.length) {
        game_state = 'CREDITS'; playBGM('bgm_end'); 
        let hud = document.getElementById('hud-panel');
        if (hud) hud.classList.add('hidden');
        return;
    }

    is_dead = false; current_level = idx;
    let base_map = LEVELS_DATA[current_level];
    current_map = []; objects = []; room_dashed = false;

    if (!level_state[current_level]) level_state[current_level] = { treasures: [], keys: [], chests: [] };
    let state = level_state[current_level];

    // Calcula Tesouros Globais (de todas as fases salvas)
    hud_treasures = 0;
    for (let lvl in level_state) {
        hud_treasures += level_state[lvl].treasures.length;
    }
    
    // Reseta as chaves (Se morrer ou trocar de fase, as chaves "em mãos" são perdidas)
    p.session_keys = [];
    hud_keys = 0;
    updateHUD();
    
    // Inicia Timer da tela
    if (!is_death && typeof level_start_time !== 'undefined') level_start_time = performance.now();

    for (let y = 0; y < 18; y++) {
        let row = [];
        for (let x = 0; x < 20; x++) {
            if (base_map[y] && base_map[y][x] !== undefined) { row.push(base_map[y][x]); } else { row.push(0); }
        }
        current_map.push(row);
    }

    for (let y = 0; y < 18; y++) {
        for (let x = 0; x < 20; x++) {
            let val = current_map[y][x];
            if (val === 0) continue;
            let tileId = val - 1;
            let obj_id = `${x},${y}`;

            if (tileId === TILES.BALLOON) { objects.push(new Balloon(x*8, y*8)); current_map[y][x] = 0; }
            else if (TILES.BALLOON_TAIL.includes(tileId)) { current_map[y][x] = 0; } 
            else if (tileId === TILES.SPRING[0]) { objects.push(new Spring(x*8, y*8)); current_map[y][x] = 0; }
            else if (tileId === TILES.SPIKE_UP) { objects.push(new Spike(x*8, y*8, 0)); current_map[y][x] = 0; }
            else if (tileId === TILES.SPIKE_DOWN) { objects.push(new Spike(x*8, y*8, 1)); current_map[y][x] = 0; }
            else if (tileId === TILES.SPIKE_RIGHT) { objects.push(new Spike(x*8, y*8, 2)); current_map[y][x] = 0; }
            else if (tileId === TILES.SPIKE_LEFT) { objects.push(new Spike(x*8, y*8, 3)); current_map[y][x] = 0; }
            else if (tileId === TILES.CRUMBLE[0]) { objects.push(new CrumbleBlock(x*8, y*8)); current_map[y][x] = 0; }
            
            else if (tileId === TILES.TREASURE) { 
                if (!state.treasures.includes(obj_id)) objects.push(new Treasure(x*8, y*8, false, obj_id)); 
                current_map[y][x] = 0; 
            }
            else if (tileId === TILES.ORB) { 
                if (!state.treasures.includes(obj_id)) objects.push(new Treasure(x*8, y*8, true, obj_id)); 
                current_map[y][x] = 0; 
            }
            else if (tileId === TILES.KEY[0]) { 
                if (!state.keys.includes(obj_id)) objects.push(new Key(x*8, y*8, obj_id)); 
                current_map[y][x] = 0; 
            }
            else if (tileId === TILES.CHEST) { 
                let chest_treasure_id = obj_id + "_t";
                if (!state.chests.includes(obj_id)) {
                    objects.push(new Chest(x*8, y*8, obj_id)); 
                } else if (!state.treasures.includes(chest_treasure_id)) {
                    objects.push(new Treasure(x*8, (y*8) - 12, false, chest_treasure_id));
                }
                current_map[y][x] = 0; 
            }

            else if (tileId === TILES.FAKE_WALL.TL) { 
                objects.push(new FakeWall(x*8, y*8)); current_map[y][x] = 0; if (x+1 < 20) current_map[y][x+1] = 0;
                if (y+1 < 18) { current_map[y+1][x] = 0; if (x+1 < 20) current_map[y+1][x+1] = 0; }
            }
            else if (tileId === TILES.CLOUD_LEFT[0]) { objects.push(new Cloud(x*8, y*8, -1)); current_map[y][x] = 0; if (x+1 < 20) current_map[y][x+1] = 0; }
            else if (tileId === TILES.CLOUD_RIGHT[0]) { objects.push(new Cloud(x*8, y*8, 1)); current_map[y][x] = 0; if (x+1 < 20) current_map[y][x+1] = 0; }
        }
    }

    let spawn_x_tile = SPAWN_X_PER_LEVEL[current_level] !== undefined ? SPAWN_X_PER_LEVEL[current_level] : 10;
    let spawn_y_tile = 16; 

    for (let r = 17; r >= 0; r--) {
        let val = current_map[r][spawn_x_tile];
        if (val === 0 || (!TILES.SOLID.includes(val - 1) && !TILES.ICE.includes(val - 1))) {
            spawn_y_tile = r; 
            break;
        }
    }

    if (is_death || current_level === 0) { 
        p.x = spawn_x_tile * 8; 
        p.y = spawn_y_tile * 8; 
        p.spd.x = 0; p.spd.y = 0; 
        p.is_spawning = false; 
    } else { 
        p.x = spawn_x_tile * 8; 
        p.y = (spawn_y_tile * 8) + 16; 
        p.spd.x = 0; p.spd.y = -4; 
        p.is_spawning = true; 
    }
    
    p.djump = max_djump; p.dash_time = 0; p.rem = {x: 0, y: 0};
    trail_particles = []; screen_shake = 0; 
}

function check_oneway(x, y, w, h, ox, oy) {
    if (oy <= 0) return false; 
    for (let obj of objects) {
        if (obj.is_oneway) {
            let currently_inside = rectIntersect(x, y - oy, w, h, obj.x, obj.y, obj.w, obj.h);

            for (let i = 0; i < 4; i++) {
                ctx.fillStyle = password_cursor === i ? '#fff' : '#6b7280'; ctx.fillText(password_input[i].toString(), 50 + i * 20, 80);
                if (password_cursor === i) ctx.fillText("_", 50 + i * 20, 84);
            }
            ctx.fillStyle = password_cursor === 4 ? '#fff' : '#6b7280'; ctx.fillText((password_cursor === 4 ? "> " : "") + "ENTRAR", 50, 120);
            ctx.fillStyle = password_cursor === 5 ? '#fff' : '#6b7280'; ctx.fillText((password_cursor === 5 ? "> " : "") + "VOLTAR", 110, 120);
        }
        ctx.textAlign = 'left';
        requestAnimationFrame(gameLoop); return;
    }

    // --- RENDERIZAÇÃO DO JOGO (E OVERLAYS) ---
    ctx.save(); 
    if (screen_shake > 0) { let dx = Math.floor(Math.random() * 5) - 2; let dy = Math.floor(Math.random() * 5) - 2; ctx.translate(dx, dy); screen_shake--; }
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let y = 0; y < 18; y++) {
        for (let x = 0; x < 20; x++) {
            let val = current_map[y][x];
            if (val > 0) drawTile(ctx, val - 1, x * 8, y * 8);
        }
    }

    for (let obj of objects) obj.draw(ctx);

    for (let i = trail_particles.length - 1; i >= 0; i--) {
        let part = trail_particles[i]; part.life++; let step = Math.floor(part.life / 3); 
        const sequence = [0, 1, 2, 1, 0]; 
        if (step < sequence.length) {
            if (part.img.complete && part.img.naturalHeight > 0) ctx.drawImage(part.img, sequence[step] * 8, 5 * 8, 8, 8, Math.round(part.x), Math.round(part.y), 8, 8);
            else { ctx.fillStyle = '#ffffff'; let size = step === 2 ? 6 : (step === 1 || step === 3 ? 4 : 2); ctx.fillRect(Math.round(part.x) + (8-size)/2, Math.round(part.y) + (8-size)/2, size, size); }
        } else trail_particles.splice(i, 1);
    }

    if (is_dead) {
        let all_done = true; const sequence = [0, 1, 2, 1, 0]; 
        for (let part of dead_particles) {
            part.x += part.vx; part.y += part.vy; part.life++; let step = Math.floor(part.life / 4); 
            if (step < sequence.length) {
                all_done = false; 
                if (part.img.complete && part.img.naturalHeight > 0) ctx.drawImage(part.img, sequence[step] * 8, 5 * 8, 8, 8, Math.round(part.x), Math.round(part.y), 8, 8);
                else { ctx.fillStyle = '#ef4444'; let size = step === 2 ? 6 : (step === 1 || step === 3 ? 4 : 2); ctx.fillRect(Math.round(part.x) + (8-size)/2, Math.round(part.y) + (8-size)/2, size, size); }
            }
        }
        if (all_done) load_level(current_level, true); 
    } else { p.draw(ctx); }

    ctx.restore();

    // OVERLAY: TELA DE TIMER DA FASE
    if (game_state === 'TRANSITION') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = 'center';
        
        ctx.fillStyle = '#f472b6'; 
        ctx.font = '10px "Press Start 2P", monospace';
        ctx.fillText("FASE CONCLUIDA", 80, 60);
        
        ctx.fillStyle = '#f59e0b';
        ctx.font = '8px "Press Start 2P", monospace';
        ctx.fillText("TEMPO: " + last_level_time_str, 80, 85);
        
        ctx.textAlign = 'left';
    } 
    // OVERLAY: MENU DE PAUSA
    else if (is_paused) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.textAlign = 'center';
        if (pause_state === 'main') {
            ctx.fillStyle = '#f472b6'; ctx.font = 'bold 12px "Press Start 2P", monospace'; ctx.fillText("PAUSADO", 80, 35);
            ctx.font = '8px "Press Start 2P", monospace';
            
            // Navegação Atualizada do Menu
            ctx.fillStyle = pause_selection === 0 ? '#fff' : '#6b7280'; ctx.fillText((pause_selection === 0 ? "> " : "") + "RETOMAR", 80, 55);
            ctx.fillStyle = pause_selection === 1 ? '#fff' : '#6b7280'; ctx.fillText((pause_selection === 1 ? "> " : "") + "REINICIAR FASE", 80, 70);
            ctx.fillStyle = pause_selection === 2 ? '#fff' : '#6b7280'; ctx.fillText((pause_selection === 2 ? "> " : "") + "VOLTAR AO TITULO", 80, 85);
            ctx.fillStyle = pause_selection === 3 ? '#fff' : '#6b7280'; ctx.fillText((pause_selection === 3 ? "> " : "") + "TECLADO", 80, 100);
            
            // Controles de Música Dinâmicos
            ctx.fillStyle = pause_selection === 4 ? '#fff' : '#6b7280'; 
            ctx.fillText((pause_selection === 4 ? "> " : "") + "MUSICA: <" + (current_track_idx + 1) + ">", 80, 115);
            
            ctx.fillStyle = pause_selection === 5 ? '#fff' : '#6b7280'; 
            ctx.fillText((pause_selection === 5 ? "> " : "") + "LOOP: <" + (loop_current_track ? "SIM" : "NAO") + ">", 80, 130);
            
            let current_pw = PASSWORDS_PER_LEVEL[current_level];
            if (current_pw) {
                ctx.fillStyle = '#f59e0b'; 
                ctx.font = '5px "Press Start 2P", monospace';
                ctx.fillText(`SENHA: ${current_pw.join('')}`, 80, 142);
            }

        } else if (pause_state === 'controls') { drawControlsMenu(ctx, pause_selection); }
        ctx.textAlign = 'left';
    }

    requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);

</script>
